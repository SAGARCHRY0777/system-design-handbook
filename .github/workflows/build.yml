name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Site builds and docs/ is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Catches what the build will happily render anyway: a link to a page
      # nobody wrote, a duplicate slug (one page silently overwrites the
      # other in docs/), a page in a module the nav does not know about.
      # Warnings do not fail the build; errors do.
      - name: Content checks
        run: npm run check

      - run: npm run build
      # docs/ is committed so GitHub Pages can serve it straight from the
      # branch with no Pages-source change. That only stays true if it is
      # rebuilt whenever content changes, so fail the build when it drifts.
      - name: Fail if docs/ is stale
        run: |
          if ! git diff --quiet -- docs; then
            echo "docs/ is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- docs
            exit 1
          fi

      # The build renders a sim fence whether or not the sim behind it is
      # registered, and the runtime catches a throwing sim into .sim--failed
      # so the page still loads. Nothing else in this workflow executes a
      # line of sim code, so a sim that never advances, draws NaN, or leaves
      # a frame uncaptioned ships silently without this. The runner has
      # Chrome preinstalled, which is why puppeteer-core is enough and the
      # browser-bundling `puppeteer` package is not a dependency.
      - name: Sims mount and advance
        run: npm run check:sims
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
